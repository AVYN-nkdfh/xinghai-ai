<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>页面没有找到｜图度AI未来学校</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:#f4f4f8; background:radial-gradient(circle at 50% 34%,#1f2648 0,#0a0b12 44%,#060609 75%); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(560px,100%); text-align:center; }
    .mark { width:52px; height:64px; margin:0 auto 28px; object-fit:contain; filter:drop-shadow(0 8px 24px rgba(0,0,0,.32)); }
    .code { margin:0 0 8px; color:#9db4ff; font-size:14px; letter-spacing:.18em; }
    h1 { margin:0; font-size:clamp(32px,8vw,56px); line-height:1.15; }
    p { margin:18px auto 30px; color:rgba(244,244,248,.66); line-height:1.75; }
    a { display:inline-flex; min-height:48px; align-items:center; justify-content:center; padding:0 22px; border-radius:999px; color:#0b0b10; background:#fff; text-decoration:none; font-weight:800; }
    a:focus-visible { outline:3px solid #9db4ff; outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="assets/todo-shield.png" alt="" width="52" height="64" />
    <p class="code">404</p>
    <h1>这一束光走错舞台了</h1>
    <p>你访问的页面不存在，或已经换了位置。回到图度AI未来学校首页，继续选择孩子的成长方向。</p>
    <a href="/">返回首页</a>
  </main>
</body>
</html>
