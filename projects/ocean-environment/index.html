<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#72c9f3" />
<title>海洋会记住｜儿童视角海洋环保 V4</title>
<link rel="preload" as="image" href="./assets/scene-1-surface.webp" type="image/webp" fetchpriority="high" />
<style>
:root{--ink:#154d78;--paper:#fffdf2;--yellow:#ffe77a;--red:#ef6d69}
*{box-sizing:border-box}
html,body{margin:0;background:#061729;color:#fff;font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",system-ui,sans-serif}
body{overflow-x:hidden}
button{font:inherit}
#story{height:980vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden;background:#061729}
.phone{position:relative;width:min(430px,100vw);height:min(880px,100dvh);overflow:hidden;background:#72c9f3;isolation:isolate;border-radius:30px;border:7px solid rgba(255,255,255,.12);box-shadow:0 28px 80px rgba(0,0,0,.48)}
.scene{position:absolute;inset:-1.5%;width:103%;height:103%;object-fit:cover;opacity:0;transform:scale(1.025);will-change:opacity,transform;pointer-events:none}
.scene:first-child{opacity:1}
.paper{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.11;mix-blend-mode:multiply;background:repeating-linear-gradient(13deg,rgba(14,73,120,.18) 0 1px,transparent 1px 6px)}
.dim{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(to bottom,transparent 22%,rgba(2,25,60,var(--dim,.02)));transition:background .2s}
.brand{position:absolute;z-index:22;left:13px;top:max(12px,env(safe-area-inset-top));padding:5px 9px;color:var(--ink);background:rgba(255,253,242,.88);border:2px solid rgba(21,77,120,.5);border-radius:999px;font-size:12px;font-weight:700;box-shadow:2px 3px 0 rgba(21,77,120,.14)}
.scroll{position:absolute;z-index:22;right:13px;top:max(12px,env(safe-area-inset-top));padding:5px 9px;color:var(--ink);background:rgba(255,253,242,.88);border:2px solid rgba(21,77,120,.5);border-radius:999px;font-size:12px;font-weight:700;box-shadow:2px 3px 0 rgba(21,77,120,.14)}
.scroll b{display:inline-block;animation:bob 1s ease-in-out infinite} @keyframes bob{50%{transform:translateY(3px)}}
.time{position:absolute;z-index:24;left:50%;top:max(54px,calc(env(safe-area-inset-top) + 44px));transform:translateX(-50%) rotate(-1.5deg);color:var(--ink);background:#fff3a7;border:2px solid rgba(21,77,120,.5);border-radius:10px 13px 9px 12px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:2px 3px 0 rgba(21,77,120,.12)}
.chip{position:absolute;z-index:25;width:min(185px,46vw);color:var(--ink);background:rgba(255,253,242,.94);border:2px solid rgba(21,77,120,.6);border-radius:13px 10px 14px 11px;padding:8px 10px;box-shadow:3px 4px 0 rgba(21,77,120,.15);transition:opacity .2s,transform .2s;pointer-events:none}
.chip strong{display:block;font-size:16px;line-height:1.12} .chip small{display:block;margin-top:3px;font-size:11px;line-height:1.35;color:#356b91}
.pos-tr{right:12px;top:17%;transform:rotate(1deg)} .pos-tl{left:12px;top:18%;transform:rotate(-1deg)} .pos-mr{right:12px;top:42%;transform:rotate(1deg)} .pos-ml{left:12px;top:36%;transform:rotate(-1deg)}
.bottleWrap{position:absolute;z-index:28;left:50%;top:0;width:29%;aspect-ratio:2/3;transform:translate(-50%,14vh) rotate(-12deg);transform-origin:center;will-change:transform,opacity;filter:drop-shadow(0 5px 3px rgba(13,74,117,.18));cursor:default}
.bottle{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .16s}
.bottle.float{opacity:1}
.turtleSprite{display:none!important;position:absolute;z-index:13;left:-55%;top:39%;width:47%;opacity:0;transform:rotate(2deg);transition:opacity .15s;filter:drop-shadow(0 4px 2px rgba(13,74,117,.15));pointer-events:none}
.turtleWord{position:absolute;z-index:26;left:29%;top:33%;max-width:104px;padding:7px 9px;text-align:center;color:var(--ink);background:rgba(255,253,242,.95);border:2px solid rgba(21,77,120,.58);border-radius:50%;font-size:13px;font-weight:800;opacity:0;transform:scale(.75) rotate(-3deg);transition:.2s;pointer-events:none}
.turtleWord.show{opacity:1;transform:scale(1) rotate(-3deg)}
.microLayer,.fragLayer,.bubbleLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbleLayer{z-index:9} .fragLayer{z-index:14;opacity:0} .microLayer{z-index:12;opacity:0}
.bubble{position:absolute;bottom:-10%;left:var(--x);width:var(--s);height:var(--s);border:2px solid rgba(255,255,255,.75);border-radius:50%;animation:rise var(--d) linear infinite;animation-delay:var(--delay);opacity:0} @keyframes rise{10%{opacity:.65}85%{opacity:.35}100%{transform:translate(var(--drift),-115vh);opacity:0}}
.frag{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:var(--c);border:1px solid rgba(255,255,255,.8);border-radius:27% 63% 35% 58%;transform:rotate(var(--r));animation:fragFloat var(--d) ease-in-out infinite alternate} @keyframes fragFloat{to{transform:translate(var(--mx),var(--my)) rotate(calc(var(--r) + 100deg))}}
.micro{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);border:1px solid rgba(255,255,255,.62);animation:micro var(--d) ease-in-out infinite alternate} @keyframes micro{to{transform:translate(var(--mx),var(--my))}}
.chain{position:absolute;z-index:26;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.chain.show{opacity:1;transform:none} .chain span{padding:5px 7px;color:var(--ink);background:rgba(255,253,242,.92);border:2px solid rgba(21,77,120,.5);border-radius:9px;font-size:11px;font-weight:800} .chain b{color:#fff3a7;font-size:17px;text-shadow:0 1px 2px #154d78}
.progress{position:absolute;z-index:29;right:8px;top:50%;transform:translateY(-50%);display:grid;gap:8px}
.progress i{display:block;width:8px;height:8px;border-radius:50%;border:2px solid #fff;background:rgba(21,77,120,.28);transition:.18s} .progress i.on{background:#fff3a7;transform:scale(1.5)}
.rescue{position:absolute;z-index:30;right:14px;left:auto;bottom:max(18px,env(safe-area-inset-bottom));transform:rotate(-1deg);padding:8px 12px;border:2px solid rgba(21,77,120,.6);border-radius:999px;color:var(--ink);background:#fff3a7;font-size:13px;font-weight:800;opacity:0;pointer-events:none;box-shadow:2px 3px 0 rgba(21,77,120,.15);white-space:nowrap;transition:.2s}
.rescue.show{opacity:1}
.bottleWrap.ready{cursor:pointer;animation:pulse 1.05s ease-in-out infinite}.bottleWrap.ready::before{content:"";position:absolute;inset:-24%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(255,243,167,.72) 0,rgba(255,243,167,.28) 38%,transparent 72%);animation:halo 1.05s ease-in-out infinite}@keyframes halo{50%{transform:scale(1.12);opacity:.72}} @keyframes pulse{50%{filter:drop-shadow(0 0 14px #fff3a7)}}
.success{position:absolute;z-index:40;left:50%;top:18%;width:80%;transform:translate(-50%,8px) rotate(-1deg);padding:12px 14px;text-align:center;color:var(--ink);background:rgba(255,253,242,.96);border:3px solid rgba(21,77,120,.65);border-radius:17px 13px 18px 14px;box-shadow:4px 5px 0 rgba(21,77,120,.15);opacity:0;pointer-events:none;transition:.4s}
.success.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)} .success strong{display:block;font-size:21px} .success small{display:block;margin-top:5px;font-size:12px;line-height:1.4}
.replay{position:absolute;z-index:41;right:13px;bottom:max(15px,env(safe-area-inset-bottom));padding:7px 10px;color:var(--ink);background:rgba(255,253,242,.92);border:2px solid rgba(21,77,120,.6);border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none} .replay.show{opacity:1;pointer-events:auto}
.phone.cleaned .scene[data-i="0"]{opacity:1!important} .phone.cleaned .scene:not([data-i="0"]),.phone.cleaned .microLayer,.phone.cleaned .fragLayer,.phone.cleaned .chip,.phone.cleaned .time,.phone.cleaned .turtleSprite,.phone.cleaned .turtleWord,.phone.cleaned .chain,.phone.cleaned .rescue{opacity:0!important}
.phone.cleaned .bottleWrap{animation:lift 1.25s ease forwards} @keyframes lift{to{transform:translate(-50%,-35vh) rotate(-25deg) scale(.55);opacity:0}}
.note{position:fixed;left:20px;bottom:18px;max-width:280px;color:rgba(255,255,255,.65);font:13px/1.45 system-ui,sans-serif}
@media(max-width:520px){.phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}.note{display:none}}
</style>
</head>

];
const colors=['#fff','#63c9f1','#ff8ca8','#ffd34d','#63d49a','#8f77ed','#ff9468'];
for(let i=0;i<17;i++){let e=document.createElement('i');e.className='bubble';e.style.cssText=`--x:${3+Math.random()*94}%;--s:${7+Math.random()*16}px;--d:${6+Math.random()*8}s;--delay:${-Math.random()*12}s;--drift:${-28+Math.random()*56}px`;bubbleLayer.appendChild(e)}
for(let i=0;i<20;i++){let e=document.createElement('i');e.className='frag';e.style.cssText=`--x:${12+Math.random()*76}%;--y:${25+Math.random()*54}%;--s:${4+Math.random()*8}px;--c:${colors[1+Math.floor(Math.random()*(colors.length-1))]};--r:${Math.random()*180}deg;--mx:${-12+Math.random()*24}px;--my:${-9+Math.random()*18}px;--d:${2+Math.random()*3}s`;fragLayer.appendChild(e)}
for(let i=0;i<90;i++){let e=document.createElement('i');e.className='micro';e.style.cssText=`--x:${2+Math.random()*96}%;--y:${15+Math.random()*78}%;--s:${2+Math.random()*4}px;--c:${colors[Math.floor(Math.random()*colors.length)]};--mx:${-9+Math.random()*18}px;--my:${-7+Math.random()*14}px;--d:${2+Math.random()*4}s`;microLayer.appendChild(e)}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), smooth=t=>t*t*(3-2*t), lerp=(a,b,t)=>a+(b-a)*t;
let last=-1,cleaned=false,ticking=false;
if('scrollRestoration' in history)history.scrollRestoration='manual';
function switchBeat(i){if(i===last)return;last=i;let b=beats[i];chip.style.opacity=0;time.style.opacity=0;setTimeout(()=>{time.textContent=b.time;chipTitle.textContent=b.title;chipBody.textContent=b.body;chip.className='chip '+b.pos;requestAnimationFrame(()=>{chip.style.opacity=1;time.style.opacity=1})},100)}
function crossfade(p){let x=p*5, base=Math.min(5,Math.floor(x)), local=x-base, fade=smooth(clamp((local-.56)/.44));scenes.forEach((s,i)=>{let o=0;if(i===base)o=1-fade;if(i===base+1)o=fade;if(base===5&&i===5)o=1;s.style.opacity=o;s.style.transform=`scale(${1.025+p*.018}) translateX(${(i%2?1:-1)*p*2}px)`})}
function bottle(p){let x=50,y=14,r=-11,w=29,op=1;if(p<.15){x=50;y=13+p*40;r=-12+p*40}else if(p<.48){let t=(p-.15)/.33;x=lerp(50,54,t);y=lerp(20,48,t);r=lerp(-4,18,t);w=lerp(29,25,t)}else if(p<.66){let t=(p-.48)/.18;x=lerp(54,67,t);y=lerp(48,57,t);r=lerp(18,31,t);w=lerp(25,21,t)}else if(p<.84){let t=(p-.66)/.18;x=lerp(58,52,t);y=lerp(56,62,t);r=lerp(26,42,t);w=lerp(23,21,t);op=lerp(1,.82,t)}else{let t=(p-.84)/.16;x=lerp(52,48,t);y=lerp(61,58,t);r=lerp(42,73,t);w=lerp(23,34,t);op=1}wrap.style.left=x+'%';wrap.style.width=w+'%';wrap.style.opacity=op;wrap.style.transform=`translate(-50%,${y}vh) rotate(${r}deg)`;bF.style.opacity=p<.13?1:0;bS.style.opacity=(p>=.13&&p<.36)?1:0;bD.style.opacity=p>=.36?1:0}
function render(){if(cleaned)return;let rect=story.getBoundingClientRect(),max=story.offsetHeight-innerHeight,p=clamp(-rect.top/max);crossfade(p);bottle(p);let bi=Math.min(5,Math.floor(p*6));switchBeat(bi);dots.forEach((d,i)=>d.classList.toggle('on',i===bi));scroll.style.opacity=p>.06?0:1;dim.style.setProperty('--dim',(p*.42).toFixed(2));fragLayer.style.opacity=p>.32&&p<.74?clamp((p-.32)/.1):0;microLayer.style.opacity=p>.62?clamp((p-.62)/.12):0;chain.classList.toggle('show',p>.66&&p<.86);turtleWord.classList.toggle('show',p>.53&&p<.63);let ready=p>.91;wrap.classList.toggle('ready',ready);rescue.classList.toggle('show',ready)}
wrap.addEventListener('click',()=>{if(!wrap.classList.contains('ready'))return;cleaned=true;phone.classList.add('cleaned');success.classList.add('show');replay.classList.add('show')});
function resetExperience(toTop=true){cleaned=false;ticking=false;last=-1;phone.classList.remove('cleaned');success.classList.remove('show');replay.classList.remove('show');wrap.classList.remove('ready');rescue.classList.remove('show');if(toTop)scrollTo(0,0);render()}
replay.addEventListener('click',()=>resetExperience(true));
function schedule(){if(ticking||cleaned)return;ticking=true;requestAnimationFrame(()=>{ticking=false;render()})}
addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule);
const q=new URLSearchParams(location.search).get('p');
addEventListener('pageshow',event=>{if(event.persisted&&q===null)requestAnimationFrame(()=>resetExperience(true))});
if(q!==null){requestAnimationFrame(()=>{scrollTo(0,(story.offsetHeight-innerHeight)*Math.max(0,Math.min(1,Number(q))));setTimeout(schedule,80)})}else requestAnimationFrame(()=>resetExperience(true));
})();
